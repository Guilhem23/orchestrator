[project]
name = "slice-orchestrator"
version = "0.5.0"
description = "Deterministic control-plane orchestrator for governed vertical slices"
authors = [
    { name = "Guilhem Imberton", email = "guilhem.imberton@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.17.0",
    "mcp>=1.2.0,<2.0.0",
]
keywords = [
    "ai-agents",
    "mcp",
    "model-context-protocol",
    "cursor",
    "claude-code",
    "sdlc",
    "quality-gates",
    "testing",
    "orchestrator",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/Guilhem23/slice-orchestrator"
Documentation = "https://github.com/Guilhem23/slice-orchestrator#readme"
Repository = "https://github.com/Guilhem23/slice-orchestrator"
Changelog = "https://github.com/Guilhem23/slice-orchestrator/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/Guilhem23/slice-orchestrator/issues"

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-timeout>=2.1.0",
]

[project.scripts]
slice = "slice_orchestrator.cli:main"
slice-orchestrator = "slice_orchestrator.cli:main"
slice-mcp = "slice_orchestrator.mcp_server:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["slice_orchestrator*"]
exclude = ["tests*", "orchestrator-extraction-bundle-*"]
