[project]
name = "slice-orchestrator"
version = "4.0.0"
description = "Deterministic control-plane orchestrator for governed vertical slices"
authors = [
    { name = "Orchestrator Project", email = "orchestrator@example.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.17.0",
    "mcp>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-timeout>=2.1.0",
]

[project.scripts]
slice = "slice_orchestrator.cli:main"
slice-orchestrator = "slice_orchestrator.cli:main"
slice-mcp = "slice_orchestrator.mcp_server:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["slice_orchestrator*"]
exclude = ["tests*", "orchestrator-extraction-bundle-*"]
